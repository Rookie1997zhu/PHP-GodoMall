<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>외부 주문 모드 안내</title>

  <!-- ✅ 定制页同款样式 -->
  <link rel="stylesheet" href="../css/custom/goods_custom.css">

  <!-- 本页专用（蓝白风格，且不影响定制页其它页面） -->
  <style>
    :root{
      --brand:#0b5cff;
      --brand2:#3b82f6;
      --bg1:#f4f8ff;
      --bg2:#ffffff;
      --line:#d7e6ff;
      --text:#0f172a;
      --muted:#475569;
    }

    /* 左侧整体蓝白渐变背景 */
    .custom-workspace{
      background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 55%, #eef6ff 100%);
    }

    .entry-required-left{
      height: 100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:40px 24px;
      background: transparent;
    }

    /* 主提示卡片 */
    .entry-required-left-inner{
      width:100%;
      max-width:760px;
      border:1px solid var(--line);
      border-radius:18px;
      padding:28px;
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(6px);
      box-shadow: 0 14px 40px rgba(11,92,255,.10);
      color: var(--text);
      line-height:1.7;
      position: relative;
      overflow:hidden;
    }
    .entry-required-left-inner:before{
      content:'';
      position:absolute;
      top:-80px; right:-80px;
      width:180px; height:180px;
      background: radial-gradient(circle at 30% 30%, rgba(11,92,255,.22), rgba(11,92,255,0) 60%);
      transform: rotate(10deg);
    }

    .entry-required-badge{
      display:inline-flex;
      align-items:center;
      gap:10px;
      font-weight:800;
      color: var(--brand);
      margin-bottom:12px;
      font-size:18px;
    }
    .entry-required-badge img{
      width:18px;height:18px;object-fit:contain;
      filter: saturate(1.2);
    }

    .entry-required-desc{
      color: var(--muted);
      font-size:15px;
    }
    .entry-required-desc strong{
      color: var(--text);
    }

    /* 右侧信息栏也做蓝白化 */
    .product-info{
      background: linear-gradient(180deg, #ffffff 0%, #f7fbff 100%);
      border-left: 1px solid var(--line);
    }
    .product-name{
      color: var(--text);
    }
    .option-label{
      color: var(--brand);
    }

    .notice-box{
      border:1px solid var(--line);
      background:#ffffff;
      border-radius:14px;
      padding:14px 14px;
      color: var(--muted);
      line-height:1.75;
      box-shadow: 0 10px 26px rgba(11,92,255,.06);
    }

    /* ✅ 单栏居中布局（覆盖 goods_custom.css 的左右两栏结构） */
    .custom-container{
      display:block;
      min-height:100vh;
      width:100%;
      background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 55%, #eef6ff 100%);
    }
    .entry-page-center{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:48px 18px;
    }
    .entry-card{
      width:100%;
      max-width:820px;
      border:1px solid var(--line);
      border-radius:20px;
      background: rgba(255,255,255,.94);
      backdrop-filter: blur(6px);
      box-shadow: 0 16px 46px rgba(11,92,255,.12);
      overflow:hidden;
    }
    .entry-card-head{
      padding:22px 22px 16px;
      border-bottom:1px solid rgba(215,230,255,.8);
      display:flex;
      align-items:center;
      gap:10px;
    }
    .entry-card-head img{
      width:18px;height:18px;object-fit:contain;
    }
    .entry-card-title{
      font-weight:900;
      color: var(--brand);
      font-size:18px;
    }
    .entry-card-body{
      padding:18px 22px 22px;
    }
  </style>
</head>

<body>
  <div class="custom-container">
    <div class="entry-page-center">
      <div class="entry-card">
        <div class="entry-card-head">
          <img src="../_mplshop/images/icon/icon_warning.png" alt="notice" loading="lazy">
          <div class="entry-card-title">외부 주문 모드 안내 / External Order Mode</div>
        </div>

        <div class="entry-card-body">
          <div class="entry-required-desc">
            <div><strong>KR:</strong> 네이버 스토어(Naver Store)에서 해당 상품 페이지를 통해 외부 주문 모드로 진입해 주세요.</div>
            <div style="margin-top:10px;"><strong>EN:</strong> Please enter this mode from the product page on Naver Store.</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
