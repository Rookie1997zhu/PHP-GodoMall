<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品定制测试页面</title>
    
    <!-- Fabric.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
    
    <!-- 样式文件 -->
    <link rel="stylesheet" href="./goods_custom.css">
    
    <style>
        .test-info {
            background-color: #e3f2fd;
            border: 1px solid #2196f3;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 20px;
        }
        
        .test-info h2 {
            color: #1976d2;
            margin-bottom: 10px;
        }
        
        .test-info ul {
            margin: 0;
            padding-left: 20px;
        }
        
        .test-info li {
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="test-info">
        <h2>商品定制功能测试页面</h2>
        <ul>
            <li>✅ Fabric.js 画布功能</li>
            <li>✅ 工具栏操作（撤销/重做、删除、对齐等）</li>
            <li>✅ 图案库网格布局</li>
            <li>✅ 文字添加功能</li>
            <li>✅ 图片上传功能</li>
            <li>✅ 颜色和尺寸选择</li>
            <li>✅ 数量控制</li>
            <li>✅ 响应式布局（仅桌面端）</li>
        </ul>
    </div>

    <div class="custom-container">
        <!-- 左侧定制工作区 -->
        <div class="custom-workspace">
            <!-- 顶部工具栏 -->
            <div class="custom-toolbar">
                <div class="toolbar-group">
                    <button class="tool-btn" id="btnRevert" title="撤销">
                        <i class="icon-revert"></i>
                    </button>
                    <button class="tool-btn" id="btnUndo" title="撤销">
                        <i class="icon-undo"></i>
                    </button>
                    <button class="tool-btn" id="btnRedo" title="重做">
                        <i class="icon-redo"></i>
                    </button>
                </div>
                
                <div class="toolbar-group">
                    <button class="tool-btn" id="btnDelete" title="删除">
                        <i class="icon-delete"></i>
                    </button>
                    <button class="tool-btn" id="btnForward" title="前移">
                        <i class="icon-forward"></i>
                    </button>
                    <button class="tool-btn" id="btnBackward" title="后移">
                        <i class="icon-backward"></i>
                    </button>
                </div>
                
                <div class="toolbar-group">
                    <button class="tool-btn" id="btnGroup" title="组合">
                        <i class="icon-group"></i>
                    </button>
                    <button class="tool-btn" id="btnUngroup" title="解组">
                        <i class="icon-ungroup"></i>
                    </button>
                </div>
                
                <div class="toolbar-group">
                    <button class="tool-btn" id="btnAlignLeft" title="左对齐">
                        <i class="icon-align-left"></i>
                    </button>
                    <button class="tool-btn" id="btnAlignCenter" title="居中对齐">
                        <i class="icon-align-center"></i>
                    </button>
                    <button class="tool-btn" id="btnAlignRight" title="右对齐">
                        <i class="icon-align-right"></i>
                    </button>
                </div>
                
                <div class="toolbar-group">
                    <button class="tool-btn" id="btnAlignTop" title="顶部对齐">
                        <i class="icon-align-top"></i>
                    </button>
                    <button class="tool-btn" id="btnAlignMiddle" title="垂直居中">
                        <i class="icon-align-middle"></i>
                    </button>
                    <button class="tool-btn" id="btnAlignBottom" title="底部对齐">
                        <i class="icon-align-bottom"></i>
                    </button>
                </div>
            </div>
            
            <!-- 检查按钮 -->
            <div class="check-button-container">
                <button class="check-btn" id="btnCheck">
                    <i class="icon-check"></i>
                    检查
                </button>
            </div>
            
            <!-- 产品预览区域 -->
            <div class="preview-container">
                <div class="preview-header">
                    <h3>商品定制预览</h3>
                </div>
                <div class="canvas-container">
                    <canvas id="customCanvas" width="400" height="400"></canvas>
                </div>
                <div class="scroll-indicator">
                    <i class="icon-scroll-down"></i>
                </div>
            </div>
            
            <!-- 右侧定制选项 -->
            <div class="custom-options">
                <button class="option-btn" id="btnChangeProduct" title="更换商品">
                    <i class="icon-tshirt"></i>
                    <span>更换</span>
                </button>
                
                <button class="option-btn" id="btnUploadImage" title="上传图片">
                    <i class="icon-upload"></i>
                    <span>上传图片</span>
                </button>
                
                <button class="option-btn" id="btnAddText" title="添加文字">
                    <i class="icon-text"></i>
                    <span>文字定制</span>
                </button>
                
                <button class="option-btn" id="btnPatternLibrary" title="图案库" disabled>
                    <i class="icon-palette"></i>
                    <span>图案库</span>
                    <span class="new-badge">NEW</span>
                </button>
                
                <button class="option-btn" id="btnWappens" title="Wappens">
                    <i class="icon-clock"></i>
                    <span>Wappens</span>
                </button>
            </div>
        </div>
        
        <!-- 右侧商品信息 -->
        <div class="product-info">
            <!-- 商品头部信息 -->
            <div class="product-header">
                <h1 class="product-name">Basic Adjustable Cap</h1>
                <div class="product-price">
                    <span class="price-amount">1EA or more $14.47</span>
                </div>
                <div class="product-rating">
                    <span class="stars">★ 4.9</span>
                    <span class="reviews">Reviews 292</span>
                </div>
                <div class="product-actions">
                    <button class="action-btn" id="btnShare" title="分享">
                        <i class="icon-share"></i>
                    </button>
                    <button class="action-btn" id="btnFavorite" title="收藏">
                        <i class="icon-heart"></i>
                    </button>
                </div>
            </div>
            
            <!-- 颜色选择 -->
            <div class="option-section">
                <label class="option-label">颜色 - Navy</label>
                <div class="color-options">
                    <div class="color-item active" data-color="navy" style="background-color: #1e3a8a;"></div>
                    <div class="color-item" data-color="red" style="background-color: #dc2626;"></div>
                    <div class="color-item" data-color="beige" style="background-color: #f5f5dc;"></div>
                    <div class="color-item" data-color="black" style="background-color: #000000;"></div>
                    <div class="color-item" data-color="pink" style="background-color: #ec4899;"></div>
                    <div class="color-item" data-color="white" style="background-color: #ffffff;"></div>
                    <div class="color-item" data-color="green" style="background-color: #16a34a;"></div>
                </div>
            </div>
            
            <!-- 尺寸选择 -->
            <div class="option-section">
                <label class="option-label">尺寸</label>
                <div class="size-options">
                    <div class="size-item active" data-size="4.7x2.8">4.7 x 2.8 inch</div>
                </div>
            </div>
            
            <!-- 数量选择 -->
            <div class="option-section">
                <label class="option-label">数量</label>
                <div class="quantity-container">
                    <div class="discount-notice">
                        <span>折扣随订单数量增加！</span>
                        <button class="close-notice" id="btnCloseNotice">×</button>
                    </div>
                    <div class="quantity-controls">
                        <button class="quantity-btn" id="btnDecrease">-</button>
                        <input type="number" class="quantity-input" id="quantityInput" value="1" min="1">
                        <button class="quantity-btn" id="btnIncrease">+</button>
                    </div>
                    <button class="bulk-order-btn" id="btnBulkOrder">批量订单折扣指南</button>
                    <div class="min-order">1ea minimum order</div>
                </div>
            </div>
            
            <!-- 订单摘要 -->
            <div class="order-summary">
                <div class="summary-line">
                    <span class="summary-quantity">1EA</span>
                    <span class="summary-price">$14.47</span>
                </div>
                <button class="add-to-cart-btn" id="btnAddToCart">添加到购物车</button>
            </div>
        </div>
    </div>
    
    <!-- 图案库弹窗 -->
    <div class="pattern-modal" id="patternModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>图案库</h3>
                <button class="modal-close" id="btnCloseModal">×</button>
            </div>
            <div class="modal-body">
                <div class="pattern-search">
                    <input type="text" id="patternSearch" placeholder="搜索图案...">
                </div>
                <div class="pattern-grid" id="patternGrid">
                    <!-- 图案将通过JavaScript动态加载 -->
                </div>
            </div>
        </div>
    </div>
    
    <!-- 文字编辑弹窗 -->
    <div class="text-modal" id="textModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>添加文字</h3>
                <button class="modal-close" id="btnCloseTextModal">×</button>
            </div>
            <div class="modal-body">
                <div class="text-input-group">
                    <label>文字内容：</label>
                    <input type="text" id="textContent" placeholder="请输入文字内容">
                </div>
                <div class="text-input-group">
                    <label>字体大小：</label>
                    <input type="number" id="textSize" value="20" min="8" max="100">
                </div>
                <div class="text-input-group">
                    <label>字体颜色：</label>
                    <input type="color" id="textColor" value="#000000">
                </div>
                <div class="text-input-group">
                    <label>字体：</label>
                    <select id="textFont">
                        <option value="Arial">Arial</option>
                        <option value="Times New Roman">Times New Roman</option>
                        <option value="Courier New">Courier New</option>
                        <option value="Verdana">Verdana</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button class="btn-cancel" id="btnCancelText">取消</button>
                    <button class="btn-confirm" id="btnConfirmText">确认</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 隐藏的文件上传输入 -->
    <input type="file" id="imageUpload" accept="image/*" style="display: none;">
    
    <!-- 隐藏的图案数据（测试用空数组） -->
    <script id="patternsData" type="application/json" style="display: none;">
        []
    </script>
    
    <!-- 页面配置数据 -->
    <script id="pageConfig" type="application/json" style="display: none;">
        {
            "goods_id": "1",
            "can_customize": true,
            "max_upload_size": 5242880,
            "allowed_image_types": ["jpg", "jpeg", "png", "gif"]
        }
    </script>
    
    <!-- JavaScript文件 -->
    <script src="./goods_custom.js"></script>
</body>
</html>
